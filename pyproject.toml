[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta_v2"
version = "0.1.0"
description = "Метаэвристический бенчмарк (HPO + NAS): FCNet и NATS-Bench, оптимизаторы mealpy, TPE-тюнинг, Performance Profiles"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
    "mealpy==3.0.2",
    "optuna==4.9.0",
    "ConfigSpace==1.2.0",
    "nats_bench",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["benchmarks", "encoding", "optimizers", "tuning", "metrics", "experiment"]